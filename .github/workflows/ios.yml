name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Capacitor config
        run: |
          rm -f capacitor.config.ts

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.alstudy.game",
            "appName": "AL Study Game",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS device app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_VERSION=5.0 \
            build

      - name: Create unsigned IPA
        run: |
          mkdir -p ipa/Payload

          cp -R \
            build/ios/Build/Products/Debug-iphoneos/App.app \
            ipa/Payload/App.app

          cd ipa
          zip -r ../AL-Study-Game-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AL-Study-Game-unsigned-IPA
          path: AL-Study-Game-unsigned.ipa
          if-no-files-found: error
